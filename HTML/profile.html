<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview</title>
    <link rel="stylesheet" href="../css/profile.css">
</head>
<body>
    <div class="dashboard">
        <div class="sidebar">
            <div class="profile">
                <div class="avatar">DU</div>
                <div class="user-info">
                    <h3>Demo User</h3>
                    <p>demo@webtech.practice</p>
                </div>
            </div>
            <h4>DASHBOARD</h4>
            <ul class="menu">
                <li>Overview</li>
                <li class="active">Profile Settings</li>
                <li>Security</li>
                <li>Notification</li>
            </ul>
            <h4>QUICK ACTION</h4>
            <ul class="menu">
                <li>Help & Support</li>
            </ul>
            <div class="account">
                <h4>ACCOUNT</h4>
                <ul class="menu">
                    <li>Sign Out</li>
                </ul>
            </div>
        </div>
        <div class="main">
            <div class="topbar">
                <h2>WebTech Practice Dashboard</h2>
            </div>
            <div class="content">
                <div class="profile-card">
                    <h2>Profile Settings</h2>
                    <h3>Personal Information</h3>
                    <div class="row">
                        <div class="input-box">
                            <label>Full Name</label>
                            <input type="text" value="Demo User">
                        </div>
                            <div class="input-box">
                                <label>Date of Birth</label>
                                <input type="date">
                            </div>
                        </div>
                        
                    <div class="row">
                        <div class="input-box">
                            <label>Email Address</label>
                            <input type="email" value="demo@gmail.com">
                        </div>
                        <div class="input-box">
                            <label>Phone Number</label>
                            <input type="text" value="+91 9876543210">
                        </div>
                    </div>
                    <h3>Address Information</h3>
                    <div class="input-box full">
                        <label>Street Address</label>
                        <textarea placeholder="Enter your complete address"></textarea>
                    </div>
                    <div class="row">
                        <div class="input-box">
                            <label>PIN Code</label>
                            <input type="text" value="123456">
                        </div>
                        <div class="input-box">
                            <label>City</label>
                            <input type="text" value="Ranchi">
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-box">
                            <label>Country</label>
                            <input type="text" value="India">
                        </div>
                        <div class="input-box">
                            <label>GitHub Profile</label>
                            <input type="text" value="https://github.com/username">
                        </div>
                    </div>
                    <div class="buttons">
                        <button class="cancel">
                            Cancel changes
                        </button>
                        <button class="save">Save changes</button>
                    </div>
                </div>
            </div>
        </div>
