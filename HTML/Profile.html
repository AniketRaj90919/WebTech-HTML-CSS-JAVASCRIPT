<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings</title>
    <link rel="stylesheet" href="../css/profile.css"></head>

<body>

<div class="container">

    <div class="sidebar">

        <div class="profile">

            <div class="circle">
                DU
            </div>

            <div class="user">
                <h3>Demo User</h3>
                <p>demo@webtech.practice</p>
            </div>

        </div>

        <p class="title">DASHBOARD</p>

        <ul>

            <li>Overview</li>

            <li class="active">Profile Settings</li>

            <li>Security</li>

            <li>Notifications</li>

        </ul>

        <p class="title">QUICK ACTION</p>

        <ul>

            <li>Help & Support</li>

        </ul>

        <div class="account">

            <p class="title">ACCOUNT</p>

            <p>Sign Out</p>

        </div>

    </div>

    <div class="main">

        <div class="header">

            <h2>WebTech Practice Dashboard</h2>

        </div>

        <div class="card">

            <h1>Profile Settings</h1>

            <h3>Personal Information</h3>

            <form>

                <div class="row">

                    <div class="box">

                        <label>Full Name</label>

                        <input type="text" placeholder="Demo User">

                    </div>

                    <div class="box">

                        <label>Date of Birth</label>

                        <input type="date">

                    </div>

                </div>

                <div class="row">

                    <div class="box">

                        <label>Email Address</label>

                        <input type="email" placeholder="demo@webtech.practice">

                    </div>

                    <div class="box">

                        <label>Phone Number</label>

                        <input type="text" placeholder="+91 9876543210">

                    </div>

                </div>

                <h3>Address Information</h3>

                <div class="box">

                    <label>Street Address</label>

                    <textarea placeholder="Enter Street Address"></textarea>

                </div>

                <div class="row">

                    <div class="box">

                        <label>PIN Code</label>

                        <input type="text">

                    </div>

                    <div class="box">

                        <label>City</label>

                        <input type="text">

                    </div>

                </div>

                <div class="row">

                    <div class="box">

                        <label>Country</label>

                        <input type="text">

                    </div>

                    <div class="box">

                        <label>GitHub Profile</label>

                        <input type="text">

                    </div>

                </div>

                <div class="buttons">

                    <button type="reset" class="cancel">
                        Cancel Changes
                    </button>

                    <button type="submit" class="save">
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>
