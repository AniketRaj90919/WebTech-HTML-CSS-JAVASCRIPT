<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings</title>
    <link rel="stylesheet" href="../css/profile.css"></head>

<body>
        <div class="Container">
       <header class="header">
        <h3>WebTech Pactice Dashboard</h3>
    </header>
    <aside class="Sidebar">
        <div class="user-info">
            

            <h3 id="logo">DU</h3>
         <div>
            <p id="username"> Demo user</p>
            <p id="useremail">demo@webteach.practice</p>
         </div>
        </div>
        <div class="menu">
        <h4>Dashboard</h4>
        <ul>
            <li class="overview">Overview</li>
            <li class="active">Profile Setting</li>
            <li class="security">Security</li>
            <li class="notification">Notification</li>
        </ul>
        </div>
        <div class="menu">
        <h4>Quick Action</h4>
        <ul>
            <li class="help">Help & Support</li>
        </ul>
        </div>
            <div class="account-menu">
            <h4>ACCOUNT</h4>
            <ul>
                <li class="abc">Sign out</li>
            </ul>
             </div>
    </aside>


        <div class="card">

            <h1>Profile Settings</h1>

            <h3>Personal Information</h3>

            <form id="profileForm">

                <div class="row">

                    <div class="box">

                        <label>Full Name</label>

                        <input type="text" id="fullName" placeholder="Demo User">

                    </div>

                    <div class="box">

                        <label>Date of Birth</label>

                        <input type="date" id="dob" required >

                    </div>

                </div>

                <div class="row">

                    <div class="box">

                        <label>Email Address</label>

                        <input type="email" id="profileEmail" placeholder="demo@webtech.practice">

                    </div>

                    <div class="box">

                        <label>Phone Number</label>

                        <input type="tel" id="phone" placeholder="+91 9876543210"
                         required>

                    </div>

                </div>

                <h3>Address Information</h3>

                <div class="box">

                    <label>Street Address</label>

                    <textarea id="streetAddress" placeholder="Enter Street Address" required></textarea>

                </div>

                <div class="row">

                    <div class="box">

                        <label>PIN Code</label>

                        <input type="text" id="pin" placeholder="123456" required>

                    </div>

                    <div class="box">

                        <label>City</label>

                        <input type="text" id="city" placeholder="Ranchi"
                         required >

                    </div>

                </div>

                <div class="row">

                    <div class="box">

                        <label>Country</label>

                        <input type="text" id="country" placeholder="India" required >
                

                    </div>

                    <div class="box">

                        <label>GitHub Profile</label>

                        <input type="text" id="github" placeholder="https://github.com/username" 
                         >

                    </div>

                </div>

                <div class="buttons">
      <span id="profileError"></span>
                    <button type="reset" class="cancel">
                        Cancel Changes
                    </button>
          
                    <button type="submit" class="save">
                        Save Changes
                    </button>

              

                </div>

            </form>

        </div>

    </div>

</div>
<script src="../JAVASCRIPT/Profile.js"></script>
</body>

</html>
