<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup page</title>
    <link rel="stylesheet" href="../CSS/Signup.css">
</head>
<body>
    <div class="Container">
        <h1 class="heading">Create your account</h1>
        <p class="text">Sign up to access the practice deshboard</p>
        <form id="signupForm">
        <div class="row">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" id="firstName"  placeholder="Enter first name" required>
                <small id="firstNameError"></small>
                
                </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="lastName" placeholder="Enter last name " required >
                   <small id="lastNameError"></small> 
            </div>
         </div>
            <div class="form-group">
            
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email address" required>
                <small id="emailError"></small>
            
            </div>
        <div class="row">
            <div class="form-group">

                 <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
                <small id="passwordError"></small>
                <p id="passwordHint">Use at least 6 characters, with latter and number</p>
            </div>
    
            <div class="form-group">
                <label>Confirm password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                <small id="confirmPasswordError"></small>
                 
            </div>
        </div>
        <div class="checkbox">
            <input type="checkbox" id="remember" required>
            I agree to the terms.
        </div>
        <small id="checkError"></small>
        <button type="submit" class="submit" id="signup"> Create Account</button>
        



        <p class="Signin">
            Already have account?
            <a id="signin1" >Signin</a>
        </p>
        </form>
    </div>
    
    <script src="../JAVASCRIPT/Signup.js"></script>

</body>
</html>
