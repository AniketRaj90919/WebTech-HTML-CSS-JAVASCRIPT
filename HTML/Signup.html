<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup page</title>
    <link rel="stylesheet" href="../CSS/Signup.css">
</head>
<body>
    <div class="Container">
        <h1 class="heading">Create your account</h1>
        <p class="text">Sign up to access the practice deshboard</p>
 <form>
        <div class="row">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" placeholder="Enter first name" required>
                <small id="firstNameError"></small>
                
                
                </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" placeholder="Enter last name " required >
                <small id="lastNameError"></small>
                
                
            </div>
         </div>
            <div class="form-group">
            
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email address" required>
                <small id="emailError"></small>
        
            
            </div>
        <div class="row">
            <div class="form-group">

                 <label>Password</label>
                <input type="password" placeholder="Enter your password" required>
                
                
                <p id="passwordError">
                    Use at least 6 characters, with letter and number.</p>
            </div>
    
            <div class="form-group">
                <label>Confirm password</label>
                <input type="password" placeholder="Confirm password" required>
                <small id="confirmPasswordError"></small>
                
                 
            </div>
        </div>
        <div class="checkbox">
            <input type="checkbox" id="terms" required>
          <label class="terms"> I agree to the terms.</label>
        </div>
        <!-- <small id="termsError"></small> -->
        <button class="submit"> Create Account</button>
        



        <p class="Signin">
            Already have account?
            <a href="Signin.html">Signin</a>
        </p>
    </div>
  </form>
    <script src="../JAVASCRIPT/Signup.js"></script>

</body>
</html>
