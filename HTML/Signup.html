<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/Signup.css">
</head>
<body>
    <div id="main">
        <div class="head">
            <h1>Create your account</h1>
            <p> sign up to access the practice Dashboard.</p>
        </div>
        <div class="a1">
            <div class="box">
            <label>First name:</label>
            <input type="text"placeholder="Enter first name"></div>
            <div class="box">
            <label>Last name:</label>
            <input type="text"placeholder="Enter last name"></div>
        </div>
        <div class="email">
            <label class="email">Email Address:</label>
            <input type="email"placeholder="Enter your email address">
        </div>
        <div class="a1">
            <div class="box">
                <label>Password:</label>
                <input type="password"placeholder="Enter password"></div>
                <div class="box">
                    <label>Comfirm password:</label>
                    <input type="password"placeholder="Enter password">
                </div>
            </div>
            <p> Use at least 8 characters,
                    with <br> letter & number
                <p>
                    <div class="agree">
            
             <input type="checkbox">
             <span>I agree to the Terms</span>
             </div>
            <button>Create account</button>
            <div class="foot">
                <p>Already have account?</p>
                <a>Sign in</a>
            </div>     
    </div>
</body>
</html>
