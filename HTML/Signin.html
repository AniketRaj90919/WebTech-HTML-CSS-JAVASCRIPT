<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/Signin.css">
</head>
<body>
    <div class="Container">
        <h1 class="welcome">Welcome Back</h1>
        <p class="text">Sign in to continue to your deshboard </p>

        <label>Email Address:</label>
        <input type="email" placeholder="Enter your email address ">

        <label>Password:</label>
        <input type="password" placeholder="Enter your password">

        <p class="password-note">Password must be at least 6 characters long.</p>

        <div class="options">
            <label>
                <input type="checkbox">Remember me for 30 days.</label>

        <a href="#"class="forgot">Forgot password?</a>
        </div>
        <button>Sign in</button>

        <p class="signin">
            New to WebTech practice?
            <a href="#" class="create ">Create an  account</a>
        </p>
          
    </div>
    </body>
    </html>
